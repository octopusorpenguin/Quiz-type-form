                calculateMatchProfile();

        // ==========================================
        // 3. STATISTICAL ALIGNMENT CALCULATION LOGIC
        // ==========================================
        function calculateMatchProfile() {
            const tally = {};
            // Gather tallies
            Object.values(state.answers).forEach(profile => {
                tally[profile] = (tally[profile] || 0) + 1;
            });

            // Find max frequency archetype
            let match = 'introvert'; // defaults fallback
            let maxCount = -1;
            
            Object.keys(QUIZ_CONFIG.profiles).forEach(profKey => {
                const count = tally[profKey] || 0;
                if (count > maxCount) {
                    maxCount = count;
                    match = profKey;
                }
            });

            state.selectedProfile = QUIZ_CONFIG.profiles[match];
        }

            }

            if (codeField) codeField.textContent = code;

            state.isCountryDropdownOpen = false;

            const dropdown = document.getElementById('country-dropdown');
            const button = document.getElementById('country-select-btn');

        // ==========================================
        // 4. SUBMISSION AND LEAD GATE REVEAL LOGIC
        // ==========================================
        async function handleLeadSubmit(event) {
            event.preventDefault();
            
            const phoneField = document.getElementById('phone-input');
            const checkboxField = document.getElementById('compliance-check');
            const errorField = document.getElementById('phone-validation-error');
            
            if (!phoneField || !checkboxField) return;

            const trimmedPhone = phoneField.value.trim();
            
            // Validate basic phone pattern (must contain numbers and at least 7 characters)
            const cleanNumericOnly = trimmedPhone.replace(/\D/g, '');
            if (cleanNumericOnly.length < 7) {
                if (errorField) errorField.classList.remove('hidden');
                phoneField.focus();
                return;
            } else {
                if (errorField) errorField.classList.add('hidden');
            }

            // Begin form animation state
            state.submitting = true;
            updateButtonState(true);

            // Construct form values payload
            const leadPayload = {
                quiz_topic: QUIZ_CONFIG.title,
                phone_international: `${state.selectedCountry.code} ${trimmedPhone}`,
                calculated_profile_type: state.selectedProfile.title,
                calculated_subtitle: state.selectedProfile.subtitle,
                lead_bonus_asset: QUIZ_CONFIG.leadMagnet.name,
                quiz_responses: JSON.stringify(state.answers),
                submission_timestamp: new Date().toISOString()
            };

            try {
                // Post directly to endpoint
                const response = await fetch(QUIZ_CONFIG.formspreeUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(leadPayload)
                });

                if (response.ok) {
                    state.submitSuccess = true;
                } else {
                    console.warn("Target Formspree payload response issue, revealing anyway to maximize user flow...");
                }
            } catch (err) {
                console.error("Networking connection error, maximizing flow by allowing direct client reveal", err);
            } finally {
                // Instantly unlock and render final detailed results regardless of submission outcome (graceful degradation)
                state.submitting = false;
                revealFullResultsDashboard();
            }
        }

        function updateButtonState(isLoading) {
            const btn = document.getElementById('submit-lead-btn');
            const text = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            
            if (!btn || !text || !spinner) return;
            
            if (isLoading) {
                btn.disabled = true;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
                text.classList.add('hidden');
                spinner.classList.remove('hidden');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                text.classList.remove('hidden');
                spinner.classList.add('hidden');
            }
        }

                            <a href="${QUIZ_CONFIG.leadMagnet.url}" onclick="triggerChecklistMockDownload(event)" class="w-full sm:w-auto shrink-0 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-5 rounded-xl transition-all duration-200 group-hover:shadow-glow shadow-sm text-sm cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-bounce"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                                Download Checklist
                            </a>
                        </div>

                        <!-- Reset buttons -->
                        <div class="flex items-center justify-center py-2">
                            <button onclick="resetEvaluationQuiz()" class="text-xs text-neutral-500 hover:text-neutral-300 transition-colors flex items-center gap-1.5 focus:outline-none font-mono cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
                                Re-simulate Assessment (Reset)
                            </button>
                        </div>

                    </div>
                `;
                container.classList.remove('opacity-0', 'scale-[0.98]');
            }, 300);
        }

        // Mock download notification
        function triggerChecklistMockDownload(e) {
            e.preventDefault();
            alert("Success! Starting secure download of the: \n" + QUIZ_CONFIG.leadMagnet.name);
            // In a real staging production structure, you would trigger the anchor logic.
        }

        // Clean Quiz RESET state trigger
        function resetEvaluationQuiz() {
            state.currentStep = 0;
            state.answers = {};
            state.selectedProfile = null;
            state.submitting = false;
            state.submitSuccess = false;
            
            const header = document.getElementById('header-title');
            if (header) {
                header.innerHTML = QUIZ_CONFIG.title;
            }

            navigateTo(0);
        }

        // ==========================================
        // 5. LEGAL MODALS CORE MANAGER INTERACTION
        // ==========================================
        const modalContentDb = {
            privacy: {
                title: "Privacy Policy",
                content: `
                    <p>At Marketing Strategy Labs, we respect your confidentiality. We do not rent, distribute, or leverage marketing phone metrics compiled during response evaluations to third-party institutions.</p>
                    <p><strong>Database Capture & Storage:</strong> Mobile numbers entered into the identity portal are proxy-linked via secure endpoints solely to forward campaign profiles. Analytical responses will be cleared routinely from internal cache buffers within 30 days of submission.</p>
                    <p><strong>Transactional Messages:</strong> By entering details, you authorize automated transaction reports. You hold full authority to unsubscribe by sending STOP to standard numbers anytime.</p>
                `
            },
            terms: {
                title: "Terms of Service",
                content: `
                    <p>Usage of the Interactive Profile Simulator indicates full acceptance of the outlined terms and operating models.</p>
                    <p><strong>Evaluation Accuracy:</strong> Strategic suggestions and archetypes calculated at evaluation completion are built on structured algorithmic responses and do not constitute high-risk financial, strategy, or commercial guarantees.</p>
                    <p><strong>Digital Asset Redistribution:</strong> PDF audits and campaign checkpoints are properties of our company. Unauthorized resale or programmatic exploitation is forbidden.</p>
                `
            },
            contact: {
                title: "Contact Us",
                content: `
                    <p>Do you have inquiries regarding our business evaluations, technical audits, or configuration parameters?</p>
                    <p>Feel free to reach out directly to the active integration team at:</p>
                    <p class="font-mono bg-neutral-800 text-blue-400 p-3 rounded-lg border border-neutral-700 text-xs text-center">
                        support@marketingstrategylabs.io
                    </p>
                    <p>We target replying to high-priority partner inquiries in less than 24 business hours.</p>
                `
            }
        };

        function showModal(type) {
            const data = modalContentDb[type];
            if (!data) return;

            const modal = document.getElementById('legal-modal');
            const card = document.getElementById('modal-card');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            if (!modal || !card || !title || !content) return;

            title.textContent = data.title;
            content.innerHTML = data.content;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('translate-y-4');
            }, 50);
        }

        function closeModal() {
            const modal = document.getElementById('legal-modal');
            const card = document.getElementById('modal-card');
            
            if (!modal || !card) return;

            modal.classList.add('opacity-0');
            card.classList.add('translate-y-4');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Start initialization sequence
        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
